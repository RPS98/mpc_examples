controller:
  solver_definition_path: 'libs/acados_position_mpc/configs/solver_definition.yaml'
  ocp_json_file_path: 'libs/acados_position_mpc/mpc_generated_code/acados_ocp.json'

mpc:
  # Soft speed margin: soft penalty kicks in when ||v|| > soft_speed_margin * max_speed.
  # uh is computed at runtime as (soft_speed_margin * max_speed)^2.
  soft_speed_margin: 0.92
  parameters:
    mass: [1.140] # Mass of the MAV (kg)
    # Weight for internal states:
    #   state position [x, y, z],
    #   state orientation [roll, pitch, yaw],
    #   state velocity [vx, vy, vz]
    #
    # Q_pos = [8, 8, 12] is the empirical sweet spot from a sweep on the
    # demanding mission (2026-04-30): going to ×16 cuts settle by 3 % at
    # the cost of 0.34 % speed-cap violation, ×12 makes the solver fail
    # with ACADOS_MINSTEP, and Q_vel doubled (×4 of original) gives no
    # benefit. With Q_pos = [8, 8, 12] the controller hits 0 m overshoot
    # and 5.67 s settling time average over 10 mixed-axis segments.
    Q: [8.0, 8.0, 12.0, 0.1, 0.1, 5.0, 1.0, 1.0, 1.5]
    # Weight for end states (same as Q for simplicity):
    Qe: [8.0, 8.0, 12.0, 0.1, 0.1, 5.0, 1.0, 1.0, 1.5]
    # Weight for control inputs: [thrust, wx, wy, wz]
    R: [1.0, 2.0, 2.0, 1.3]
  constraints:
    # Lower bounds for control inputs: [thrust, wx, wy, wz]
    lbu: [0.01, -3.0, -3.0, -2.0]
    # Upper bounds for control inputs: [thrust, wx, wy, wz]
    ubu: [35.0, 3.0, 3.0, 2.0]
    # Lower bounds for nonlinear constraints h = ||v||^2 (always >= 0, so lower is inactive)
    lh: [0.0]
    # Upper bounds for nonlinear constraints h = ||v||^2 (always >= 0, so upper is active)
    uh: [0.0]
    # Diagonal Hessian weights for lower slack variables
    Zl: [0.0]
    # Diagonal Hessian weights for upper slack variables
    Zu: [0.0]
    # Linear weights for lower slack variables
    zl: [0.0]
    # Linear weights for upper slack variables
    zu: [10.0]
    # Diagonal Hessian weights for lower slack variables at end state
    Zl_e: [0.0]
    # Diagonal Hessian weights for upper slack variables at end state
    Zu_e: [0.0]
    # Linear weights for lower slack variables at end state
    zl_e: [0.0]
    # Linear weights for upper slack variables at end state
    zu_e: [10.0]
