controller:
  solver_definition_path: 'libs/acados_position_mpc/configs/solver_definition.yaml'
  ocp_json_file_path: 'libs/acados_position_mpc/mpc_generated_code/acados_ocp.json'

mpc:
  # Safety knob applied as `v_ref = sqrt(constraints.uh[0]) * max_vel_percentage`.
  # The same value also caps the solver's runtime `uh = v_ref²`, so the
  # reference ramp and the soft speed bound stay consistent. ∈ (0, 1].
  max_vel_percentage: 0.95
  parameters:
    mass: [1.233]   # kg
    # State weights: position [x, y, z], orientation [roll, pitch, yaw],
    # velocity [vx, vy, vz].
    Q:  [5.0, 5.0, 10.0, 0.1, 0.1, 10.0, 1.5, 1.5, 2.0]
    Qe: [10.0, 10.0, 20.0, 0.1, 0.1, 20.0, 1.5, 1.5, 2.0]
    # Control-input weights: [thrust, wx, wy, wz].
    R: [0.8, 10.0, 10.0, 3.0]
  constraints:
    lbu: [0.01, -1.0, -1.0, -2.0]   # lower bound on [thrust, wx, wy, wz]
    ubu: [40.0,  1.0,  1.0,  2.0]   # upper bound on [thrust, wx, wy, wz]
    lh: [0.0]                       # lower bound on h = ||v||² (inactive at 0)
    uh: [0.9]                       # upper bound on h = ||v||² (m²/s²)
    # Slack-variable Hessian weights.
    Zl: [0.0]
    Zu: [0.0]
    zl: [0.0]
    zu: [10.0]
    Zl_e: [0.0]
    Zu_e: [0.0]
    zl_e: [0.0]
    zu_e: [10.0]
