v_max: 3.0 # Max velocity output from position PID (m/s)
d_max: 2.0 # Max reference distance from current position (m)

controller:
  position:
    kp: [1.2, 1.2, 1.6] # Position controller proportional gains: [x, y, z]
    ki: [0.0, 0.0, 0.0] # Position controller integral gains: [x, y, z]
    kd: [0.0, 0.0, 0.0] # Position controller derivative gains: [x, y, z]
    antiwindup_cte: 1.0 # Position controller anti-windup correction term: [x, y, z]
    alpha: 0.2 # Position controller low-pass filter coefficient: [x, y, z]
  velocity:
    kp: [1.6, 1.6, 2.0] # Velocity controller proportional gains: [x, y, z]
    ki: [0.0, 0.0, 0.0] # Velocity controller integral gains: [x, y, z]
    kd: [0.35, 0.35, 0.7] # Velocity controller derivative gains: [x, y, z]
    antiwindup_cte: 0.4 # Velocity controller anti-windup correction term: [x, y, z]
    alpha: 0.1 # Velocity controller low-pass filter coefficient: [x, y, z]
    saturation_upper: [10.0, 10.0, 15.0] # Velocity controller saturation upper limits: [x, y, z]
    saturation_lower: [-10.0, -10.0, -15.0] # Velocity controller saturation lower limits: [x, y, z]
  geometric:
    mass: 1.140 # Mass of the vehicle
    rotation_kp: [4.0, 4.0, 2.0] # Geometric controller proportional gains for rotation: [roll, pitch, yaw]
