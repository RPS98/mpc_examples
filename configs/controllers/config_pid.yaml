# Cascaded PID config for the position scope (waypoints generator). The
# trajectory-scope cases use config_pid_trajectory.yaml.
#
# Values mirror simulation/config/config.yaml -> geometric_position_controller
# (aerostack2). When launched through launch/<mission>/<combo>/mav.bash, the generator script
# `simulation/scripts/generate_mpc_examples_configs.py` deep-merges that
# aerostack2 block on top of this file, so a 1:1 base keeps the merge a
# no-op and the direct single scripts run with the same tuning.
controller:
  position:
    kp: [1.2, 1.2, 2.0]
    ki: [0.01, 0.01, 0.1]
    kd: [0.0, 0.0, 0.0]
    antiwindup_cte: 1.0
    alpha: 0.2
  velocity:
    kp: [1.0, 1.0, 1.5]
    ki: [0.02, 0.02, 0.2]
    kd: [0.50, 0.50, 0.7]
    antiwindup_cte: 0.4
    alpha: 0.1
    saturation_upper: [10.0, 10.0, 15.0]
    saturation_lower: [-10.0, -10.0, -15.0]
  geometric:
    mass: 1.233
    rotation_kp: [4.0, 4.0, 2.0]
