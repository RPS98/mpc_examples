# Direct trajectory PID config (used by PidTrajectoryGeometricController:
# parallel pos/vel feedback with a_ref feedforward). For smooth generators
# (jerk_limited, gcopter, dynamic, mav_traj_gen) and trajectory MPC.
#
# Values mirror simulation/config/multirotor/uav_config.yaml controller.trajectory
# (aerostack2) so the two backends run the same outer-loop tuning.

v_max: 3.0   # m/s

controller:
  trajectory:
    kp: [10.0, 10.0, 10.0]
    ki: [0.005, 0.005, 0.005]
    kd: [6.0, 6.0, 6.0]
    antiwindup_cte: [1.0, 1.0, 1.0]
    alpha: [0.6, 0.6, 0.6]
    a_max: 0.0   # 0 → disabled, matching as2 linear_acceleration_limit: [0,0,0]
  geometric:
    mass: 1.233               # kg
    rotation_kp: [20.0, 20.0, 8.0]
