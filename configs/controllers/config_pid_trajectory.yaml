# Direct trajectory PID config tuned for trajectory tracking.
#
# This config is used by PidTrajectoryGeometricController, which uses
# TrajectoryController directly (parallel pos/vel feedback into a single
# PID) rather than the cascaded position→velocity architecture of
# PidPositionGeometricController.
#
# Suitable for smooth trajectory generators (jerk_limited, gcopter, dynamic,
# mav_traj_gen) and trajectory MPC. The trajectory PID simultaneously
# tracks position and velocity errors, with feedforward of the reference
# acceleration, which better matches the expected semantics of smooth
# trajectory references.

v_max: 3.0

controller:
  trajectory:
    # Trajectory PID gains: parallel pos/vel feedback → acceleration output
    kp: [10.0, 10.0, 10.0]
    ki: [0.005, 0.005, 0.005]
    kd: [6.0, 6.0, 6.0]
    antiwindup_cte: 1.0
    alpha: 0.6
    # Per-axis symmetric output saturation [m/s²]. Optional — leave unset to
    # disable. Physical reference: max_thrust/mass ≈ 21.9 m/s²; gravity = 9.81 m/s².
    # Diagonal worst-case (two axes simultaneous): a_max ≤ 9.81 to stay < 25 N max.
    # Typical starting point: 10.0. Increase if the controller under-drives recovery.
    # a_max: 10.0
  geometric:
    mass: 1.140
    rotation_kp: [4.5, 4.5, 2.5]
