controller:
  solver_definition_path: 'libs/acados_trajectory_mpc/configs/solver_definition.yaml'
  ocp_json_file_path: 'libs/acados_trajectory_mpc/mpc_generated_code/acados_ocp.json'

mpc:
  parameters:
    mass: [1.140] # Mass of the MAV (kg)
    # Weight for internal states:
    #   state position [x, y, z],
    #   state orientation [roll, pitch, yaw],
    #   state velocity [vx, vy, vz]
    # Velocity weights (last three) raised 8× over the original
    # [0.5, 0.5, 0.7] / [0.5, 0.5, 0.8]. The OCP has no hard |v|
    # constraint (only thrust + body-rate bounds in `constraints`), so
    # the sole pressure pulling |v_state| toward v_ref is this quadratic
    # tracking penalty. With the reference plateauing at v_max
    # (jerk_limited) the original weights left ~40% velocity overshoot;
    # 4.0 is the empirical sweet spot of the gain-only sweep
    # (2026-04-29): jerk_limited drops to ~23% over while gcopter and
    # mav_traj_gen stay at <1% / -23% (their reference shape sets the
    # ceiling, not the cost). Above 4.0 the marginal v-overshoot
    # reduction shrinks and position rmse on jerk_limited starts
    # climbing. A hard <2% bound would require a soft slack on |v|
    # (acados regen) and is not part of this gain-only tuning.
    Q: [1.0, 1.0, 1.5, 0.1, 0.1, 5.0, 4.0, 4.0, 4.0]
    # Weight for end states:
    Qe: [1.0, 1.0, 1.8, 0.1, 0.1, 5.0, 4.0, 4.0, 4.0]
    # Weight for control inputs: [thrust, wx, wy, wz]
    R: [1.0, 2.0, 2.0, 1.3]
  constraints:
    # Lower bounds for control inputs: [thrust, wx, wy, wz]
    lbu: [0.01, -3.0, -3.0, -2.0]
    # Upper bounds for control inputs: [thrust, wx, wy, wz]
    ubu: [35.0, 3.0, 3.0, 2.0]
