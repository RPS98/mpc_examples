controller:
  solver_definition_path: 'libs/acados_trajectory_mpc/configs/solver_definition.yaml'
  ocp_json_file_path: 'libs/acados_trajectory_mpc/mpc_generated_code/acados_ocp.json'

mpc:
  # Safety knob applied as `v_ref = sqrt(constraints.uh[0]) * max_vel_percentage`.
  # The current trajectory OCP is generated with `NH = 0` (no `‖v‖²`
  # constraint), so this field is forward-compat only. ∈ (0, 1].
  max_vel_percentage: 1.0
  parameters:
    mass: [1.233]   # kg
    # State weights: position [x, y, z], orientation [roll, pitch, yaw],
    # velocity [vx, vy, vz].
    Q:  [5.0, 5.0, 10.0, 0.1, 0.1, 10.0, 0.1, 0.1, 0.1]
    Qe: [10.0, 10.0, 20.0, 0.1, 0.1, 20.0, 0.1, 0.1, 0.1]
    # Control-input weights: [thrust, wx, wy, wz].
    R: [0.8, 1.0, 1.0, 1.0]
  constraints:
    lbu: [0.01, -10.0, -10.0, -10.0]   # lower bound on [thrust, wx, wy, wz]
    ubu: [40.0,  10.0,  10.0,  10.0]   # upper bound on [thrust, wx, wy, wz]
