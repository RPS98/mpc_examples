controller:
  solver_definition_path: 'libs/acados_trajectory_mpc/configs/solver_definition.yaml'
  ocp_json_file_path: 'libs/acados_trajectory_mpc/mpc_generated_code/acados_ocp.json'

mpc:
  parameters:
    mass: [1.140] # Mass of the MAV (kg)
    # Weight for internal states:
    #   state position [x, y, z],
    #   state orientation [roll, pitch, yaw],
    #   state velocity [vx, vy, vz]
    Q: [1.0, 1.0, 1.5, 0.1, 0.1, 5.0, 0.5, 0.5, 0.7]
    # Weight for end states:
    Qe: [1.0, 1.0, 1.8, 0.1, 0.1, 5.0, 0.5, 0.5, 0.8]
    # Weight for control inputs: [thrust, wx, wy, wz]
    R: [1.0, 2.0, 2.0, 1.3]
  constraints:
    # Lower bounds for control inputs: [thrust, wx, wy, wz]
    lbu: [0.01, -3.0, -3.0, -2.0]
    # Upper bounds for control inputs: [thrust, wx, wy, wz]
    ubu: [35.0, 3.0, 3.0, 2.0]
