sim_config:
  # --- Simulation timing ------------------------------------------------------
  sim_time: 160.0             # s — hard cap. Run ends at min(mission_end + hover_time, sim_time).
  model_dt: 0.001             # s — physics integration step (1 kHz).
  controller_dt: 0.01         # s — INDI + IMU loop (100 Hz).
  mpc_dt: 0.01                # s — MPC outer loop.
  pid_dt: 0.01                # s — PID outer loop.

  # --- Mission parameters -----------------------------------------------------
  max_speed: 1.0              # m/s — used by generators and scheduler.
  hover_time: 10.0            # s — hover after the last waypoint.
  settle_margin_s: 5.0        # s — extra time added to every waypoint hop.
  scheduler_speed_factor: 0.55 # ∈ (0, 1] — effective-speed factor used by
                               # WaypointScheduler (smooth generators never
                               # sustain max_speed during the whole hop).
  path_facing: false           # false → keep_yaw; true → yaw follows path tangent.

  # --- Logging / runtime ------------------------------------------------------
  output_format: mcap          # "mcap" (default) or "csv".
  benchmark: false             # true disables CSV logging for pure timing runs.
  silent: true                 # true suppresses the progress bar.
  parallel: true               # one worker per enabled case. Pair with
                               # *_delay_mode=fixed for reproducible timing.

  # --- Compute-delay model ----------------------------------------------------
  # *_delay_mode = "measured" uses the wall-clock time of the call as delay
  # applied to its output before the simulator consumes it; "fixed" uses
  # *_delay_fixed_s instead.
  controller_delay_mode: measured
  controller_delay_fixed_s: 0.0
  generator_delay_mode: measured
  generator_delay_fixed_s: 0.0

  # --- Waypoints (world frame, m) ---------------------------------------------
  # Initial state of the simulator is (0, 0, 0); the first waypoint acts as
  # takeoff. 10-waypoint mission covering all 3 axes in close (1 m) and far
  # (5-13.7 m) variants, plus 3-axis combined diagonals.
  waypoints:
    # Takeoff: Z far, single-axis (10 m)
    - [00.0, 00.0, 10.0]
    # Close single-axis hops (1 m each)
    - [01.0, 00.0, 10.0]    # +X close
    - [01.0, 01.0, 10.0]    # +Y close
    - [01.0, 01.0, 11.0]    # +Z close
    # Far single-axis hops (5 m each)
    - [06.0, 01.0, 11.0]    # +X far
    - [06.0, 06.0, 11.0]    # +Y far
    - [06.0, 06.0, 06.0]    # -Z far (descent)
    # Close 3-axis combined diagonal (~1.73 m)
    - [07.0, 07.0, 07.0]
    # Far 3-axis combined diagonal (~13.67 m, sign reversed in X and Y)
    - [-2.0, -2.0, 12.0]
    # Medium 3-axis combined return to home (~3.46 m)
    - [00.0, 00.0, 10.0]

  # --- Batch of controller × generator cases ----------------------------------
  # Single list consumed by two executables:
  #   - position_examples    picks entries whose generator is `waypoints`.
  #   - trajectory_examples  picks `gcopter | jerk_limited | dynamic | mav_traj_gen`.
  # `enabled: true|false` gates inclusion in batch runs; single scripts pass
  # both --only-controller and --only-generator and execute regardless.
  runs:
    # --- consumed by position_examples ---
    - controller: pid
      generator: waypoints
      enabled: true
      controller_config: configs/controllers/config_pid.yaml
      generator_config: configs/generators/config_waypoints.yaml

    - controller: mpc_position
      generator: waypoints
      enabled: true
      controller_config: configs/controllers/config_mpc.yaml
      generator_config: configs/generators/config_waypoints.yaml

    # --- consumed by trajectory_examples ---
    - controller: pid
      generator: gcopter
      enabled: true
      controller_config: configs/controllers/config_pid_trajectory.yaml
      generator_config: configs/generators/config_gcopter.yaml

    - controller: pid
      generator: jerk_limited
      enabled: true
      controller_config: configs/controllers/config_pid_trajectory.yaml
      generator_config: configs/generators/config_jerk_limited.yaml

    - controller: pid
      generator: dynamic
      enabled: false
      controller_config: configs/controllers/config_pid_trajectory.yaml
      generator_config: configs/generators/config_dynamic.yaml

    - controller: pid
      generator: mav_traj_gen
      enabled: false
      controller_config: configs/controllers/config_pid_trajectory.yaml
      generator_config: configs/generators/config_mav_traj_gen.yaml

    - controller: mpc_trajectory
      generator: gcopter
      enabled: true
      controller_config: configs/controllers/config_mpc_trajectory.yaml
      generator_config: configs/generators/config_gcopter.yaml

    - controller: mpc_trajectory
      generator: jerk_limited
      enabled: true
      controller_config: configs/controllers/config_mpc_trajectory.yaml
      generator_config: configs/generators/config_jerk_limited.yaml

    - controller: mpc_trajectory
      generator: dynamic
      enabled: false
      controller_config: configs/controllers/config_mpc_trajectory.yaml
      generator_config: configs/generators/config_dynamic.yaml

    - controller: mpc_trajectory
      generator: mav_traj_gen
      enabled: false
      controller_config: configs/controllers/config_mpc_trajectory.yaml
      generator_config: configs/generators/config_mav_traj_gen.yaml
