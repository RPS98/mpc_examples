sim_config:
  # --- Simulation timing ------------------------------------------------------
  sim_time: 160.0             # s, hard cap: run ends at min(mission_end + hover_time, sim_time)
  model_dt: 0.001             # s, physics integration step (1 kHz)
  controller_dt: 0.01         # s, INDI + IMU loop (100 Hz)
  mpc_dt: 0.01                # s, MPC outer loop
  pid_dt: 0.01                # s, PID outer loop

  # --- Mission parameters -----------------------------------------------------
  max_speed: 1.0              # m/s, single source of truth for generators + scheduler
  hover_time: 10.0            # s, hover after the last waypoint
  settle_margin_s: 5.0        # s, extra time added to every waypoint hop
  scheduler_speed_factor: 0.55  # effective-speed factor used by WaypointScheduler, in (0, 1]
  path_facing: false          # false: keep_yaw; true: yaw follows path tangent

  # --- Logging / runtime ------------------------------------------------------
  output_format: mcap         # "mcap" (default) or "csv"
  benchmark: false            # true disables CSV logging for pure timing runs
  silent: true                # true suppresses the progress bar
  parallel: true              # one worker per enabled case; pair with *_delay_mode=fixed for reproducibility

  # --- Compute-delay model ----------------------------------------------------
  controller_delay_mode: measured       # "measured" (wall-clock) or "fixed"
  controller_delay_fixed_s: 0.0         # delay applied to controller output when mode=fixed
  generator_delay_mode: measured        # "measured" (wall-clock) or "fixed"
  generator_delay_fixed_s: 0.0          # delay applied to generator output when mode=fixed

  # --- Waypoints (world frame, m; initial state is origin, first entry is takeoff) ---
  waypoints:
    - [00.0, 00.0, 10.0]    # takeoff, +Z far (single-axis)
    - [01.0, 00.0, 10.0]    # +X close
    - [01.0, 01.0, 10.0]    # +Y close
    - [01.0, 01.0, 11.0]    # +Z close
    - [06.0, 01.0, 11.0]    # +X far
    - [06.0, 06.0, 11.0]    # +Y far
    - [06.0, 06.0, 06.0]    # -Z far (descent)
    - [07.0, 07.0, 07.0]    # close 3-axis diagonal (~1.73 m)
    - [-2.0, -2.0, 12.0]    # far 3-axis diagonal (~13.67 m, sign reversal)
    - [00.0, 00.0, 10.0]    # 3-axis return to home (~3.46 m)

  # --- Batch of controller x generator cases (see CLAUDE.md for the matrix) ---
  runs:
    # --- position scope (position_examples) ---
    - controller: pid
      generator: waypoints
      enabled: true
      controller_config: configs/controllers/config_pid.yaml
      generator_config: configs/generators/config_waypoints.yaml

    - controller: mpc_position
      generator: waypoints
      enabled: true
      controller_config: configs/controllers/config_mpc.yaml
      generator_config: configs/generators/config_waypoints.yaml

    - controller: ssa_position_mpc
      generator: waypoints
      enabled: true
      controller_config: configs/controllers/config_ssa_position_mpc.yaml
      generator_config: configs/generators/config_waypoints.yaml

    # --- trajectory scope (trajectory_examples) ---
    - controller: pid
      generator: gcopter
      enabled: true
      controller_config: configs/controllers/config_pid_trajectory.yaml
      generator_config: configs/generators/config_gcopter.yaml

    - controller: pid
      generator: jerk_limited
      enabled: true
      controller_config: configs/controllers/config_pid_trajectory.yaml
      generator_config: configs/generators/config_jerk_limited.yaml

    - controller: pid
      generator: dynamic
      enabled: false
      controller_config: configs/controllers/config_pid_trajectory.yaml
      generator_config: configs/generators/config_dynamic.yaml

    - controller: pid
      generator: mav_traj_gen
      enabled: false
      controller_config: configs/controllers/config_pid_trajectory.yaml
      generator_config: configs/generators/config_mav_traj_gen.yaml

    - controller: mpc_trajectory
      generator: gcopter
      enabled: true
      controller_config: configs/controllers/config_mpc_trajectory.yaml
      generator_config: configs/generators/config_gcopter.yaml

    - controller: mpc_trajectory
      generator: jerk_limited
      enabled: true
      controller_config: configs/controllers/config_mpc_trajectory.yaml
      generator_config: configs/generators/config_jerk_limited.yaml

    - controller: mpc_trajectory
      generator: dynamic
      enabled: false
      controller_config: configs/controllers/config_mpc_trajectory.yaml
      generator_config: configs/generators/config_dynamic.yaml

    - controller: mpc_trajectory
      generator: mav_traj_gen
      enabled: false
      controller_config: configs/controllers/config_mpc_trajectory.yaml
      generator_config: configs/generators/config_mav_traj_gen.yaml
