sim_config:
  # --- Simulation timing ------------------------------------------------------
  sim_time: 45.0              # Hard cap on simulated time (s). The run ends
                              # at min(mission_end + hover_time, sim_time),
                              # even if that truncates the hover phase or the
                              # mission itself. Must be > 0.
  model_dt: 0.001             # Physics model timestep - 1000 Hz
  controller_dt: 0.002        # INDI + IMU update timestep - 500 Hz
  mpc_dt: 0.01                # MPC control timestep - 100 Hz
  pid_dt: 0.01                # PID control timestep - 100 Hz

  # --- Mission parameters -----------------------------------------------------
  max_speed: 1.0              # m/s, used by generators and scheduler
  hover_time: 10.0            # Seconds to hover after the last waypoint
  settle_margin_s: 10.0        # Extra time added to every waypoint hop (stabilisation)
  path_facing: true

  # --- Logging / runtime ------------------------------------------------------
  output_format: mcap         # Output format: "mcap" (default) or "csv"
  benchmark: false            # When true, disables CSV logging for pure timing runs.
  silent: true                # When true, suppresses progress bar output.
  parallel: false             # When true, the entry-point launches one worker
                              # (std::thread in C++, subprocess in Python) per
                              # enabled case. CLI flag --parallel forces true.
                              # Note: combine with controller_delay_mode: fixed
                              # for reproducible *_compute_time_us — wall-clock
                              # contention between workers contaminates
                              # 'measured' delays.

  # --- Compute-delay model ----------------------------------------------------
  # controller_delay_mode: "measured" uses the wall-clock time of each
  #   computeCommand() as the delay applied to the command before the
  #   simulator consumes it. "fixed" ignores the measurement and always
  #   applies controller_delay_fixed_s seconds instead.
  # generator_delay_mode / generator_delay_fixed_s: same semantics for the
  #   trajectory generator output (references).
  controller_delay_mode: measured
  controller_delay_fixed_s: 0.0
  generator_delay_mode: measured
  generator_delay_fixed_s: 0.0

  # --- Waypoints (world frame, m) ---------------------------------------------
  waypoints:
    - [00.0, 00.0, 10.0]
    - [10.0, 00.0, 10.0]
    # - [10.0, 10.0, 20.0]
    # - [00.0, 10.0, 20.0]
    # - [00.0, 00.0, 10.0]

  # --- Batch of controller × generator cases ----------------------------------
  # A single list of runs consumed by two executables:
  #   - position_examples     picks entries whose generator is `waypoints`.
  #   - trajectory_examples   picks entries whose generator is `gcopter`,
  #                           `jerk_limited`, `dynamic` or `mav_traj_gen`.
  # Any enabled entry outside a binary's scope is skipped with a log-info.
  # `generator_config` overrides the default YAML path for that generator;
  # it lets the two `waypoints` cases share the same adapter while using
  # different tunings (distance-clamped for PID, raw target for MPC-Position).
  runs:
    # --- consumed by position_examples ---
    - { controller: pid,            generator: waypoints,    enabled: true }
    - { controller: mpc_position,   generator: waypoints,    enabled: true,
        generator_config: configs/generators/config_waypoints_mpc.yaml }
    # --- consumed by trajectory_examples ---
    # All pid + trajectory cases use PidTrajectoryGeometricController
    # (parallel pos+vel feedback → acc, via TrajectoryController) and
    # config_pid_trajectory.yaml.
    - { controller: pid,            generator: gcopter,      enabled: true,
        controller_config: configs/controllers/config_pid_trajectory.yaml }
    - { controller: pid,            generator: jerk_limited, enabled: true,
        controller_config: configs/controllers/config_pid_trajectory.yaml }
    - { controller: pid,            generator: dynamic,      enabled: true,
        controller_config: configs/controllers/config_pid_trajectory.yaml }
    - { controller: pid,            generator: mav_traj_gen, enabled: true,
        controller_config: configs/controllers/config_pid_trajectory.yaml }
    - { controller: mpc_trajectory, generator: gcopter,      enabled: true }
    - { controller: mpc_trajectory, generator: jerk_limited, enabled: true }
    - { controller: mpc_trajectory, generator: dynamic,      enabled: true }
    - { controller: mpc_trajectory, generator: mav_traj_gen, enabled: true }
