# Jerk-limited waypoint trajectory generator config. Travel speed comes
# from configs/simulation/config_example.yaml (sim_config.max_speed). Any
# bound below set to <= 0 is disabled inside the generator.
max_acceleration: 10.0  # [m/s^2]
max_jerk: 20.0          # [m/s^3]
max_tracking_error: 0.0 # [m] feedback-based time stretch (0 -> disabled)
reach_threshold: 0.01   # [m] waypoint acceptance radius (acceptance_radius in the plugin)
