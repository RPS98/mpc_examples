[build-system]
requires = ["scikit-build-core[pyproject]", "pybind11>=2.9"]
build-backend = "scikit_build_core.build"

[project]
name = "mav_flight_mcap"
version = "0.2.0"
authors = [
    { name = "Rafael Pérez Seguí", email = "r.psegui@upm.es" },
]
description = "Python bindings for mav_flight_mcap (ROS 2 Humble-compatible MCAP logger)"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
test = ["pytest>=7", "mcap>=1.0"]

[tool.scikit-build]
cmake.minimum-version = "3.16"
cmake.build-type = "Release"
build-dir = "build"
wheel.packages = ["python/mav_flight_mcap"]
sdist.include = [
    "CMakeLists.txt",
    "include/**",
    "src/**",
    "python/**",
]
