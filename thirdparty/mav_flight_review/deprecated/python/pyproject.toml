[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mav_flight_mcap"
version = "0.1.0"
description = "MCAP logger + rerun.io viewer for quadrotor flight data."
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Rafa Perez" }]
dependencies = [
    "numpy>=1.22",
    "protobuf>=4.21",
    "mcap>=1.0",
    "mcap-protobuf-support>=0.5",
    "rerun-sdk>=0.20",
]

[project.scripts]
mav-view = "mav_flight_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mav_flight_mcap", "src/mav_flight_viewer"]
