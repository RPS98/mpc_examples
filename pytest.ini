[pytest]
# Root pytest configuration. Mirrors the suites registered in CMakeLists.txt
# (see register_pytest_suite calls) so that `pytest` invoked from the repo
# root produces the same results as `ctest -L pytest`.
#
# `pythonpath` makes the pybind mirror discoverable without having to export
# PYTHONPATH by hand; ctest does the equivalent via ENVIRONMENT.
pythonpath =
    build/python
    thirdparty/mav_simulator/libs/mav_model

# Explicit testpaths avoid pulling in old/, thirdparty submodules whose
# tests are not registered (e.g. mav_trajectory_generation_lib) and the
# deprecated mav_flight_review tests. Keep this list in sync with
# register_pytest_suite() in CMakeLists.txt.
testpaths =
    thirdparty/mav_simulator/pybind/tests
    thirdparty/mav_simulator/libs/mav_model/pybind/tests
    thirdparty/mav_simulator/libs/mav_model/model_definition/pytests
    thirdparty/mav_simulator/libs/mav_controllers/pybind/tests
    thirdparty/mav_simulator/libs/mav_controllers/controllers/pid_controllers/pybind/tests
    thirdparty/mav_simulator/libs/mav_controllers/controllers/geometric_controller/pybind/tests
    thirdparty/mav_simulator/libs/mav_controllers/controllers/indi_controller/pybind/tests
    thirdparty/mav_simulator/libs/mav_controllers/libs/pid_controller/pybind/tests
    thirdparty/mav_simulator/libs/mav_sensors/pybind/tests
    thirdparty/mav_flight_logger/tests
    thirdparty/mav_flight_review/pybind/tests
    thirdparty/mav_flight_review/viewer/tests
    thirdparty/trajectory_generator_jerk_limited/pybind/tests
    thirdparty/gcopter_lib/pybind/tests
    thirdparty/dynamic_trajectory_generator/pybind/tests
    examples_py/tests

# Belt-and-braces exclusion: even if testpaths is overridden on the CLI,
# these directories must never be walked.
norecursedirs =
    build
    .git
    old
    deprecated
    __pycache__
    simulator_logs
    libs

addopts = -ra
