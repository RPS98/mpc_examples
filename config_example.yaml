sim_config:
  sim_time: 30.0           # Total simulation time (s)
  model_dt: 0.001          # Physics model timestep - 1000Hz
  controller_dt: 0.002     # INDI + IMU update timestep - 500Hz
  mpc_dt: 0.01             # MPC control timestep - 100Hz
  max_speed: 1.0           # m/s reference advance speed
  hover_time: 2.0          # seconds to hover after trajectory
  path_facing: true
  waypoints:
    - [0.0, 0.0, 1.0]
    - [2.0, 0.0, 1.0]
    - [2.0, 2.0, 1.5]
    - [0.0, 2.0, 1.5]
    - [0.0, 0.0, 1.0]
